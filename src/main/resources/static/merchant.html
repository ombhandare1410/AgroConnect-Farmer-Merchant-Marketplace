<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>AgroConnect - Merchant</title></head><body>
<header id="hdr" data-role="merchant"></header>
<main>
 <h1 id="who"></h1>
 <div id="flash" class="msg hide" role="status"></div>

 <section id="myreqs">
  <div class="row" style="justify-content:space-between"><h2 data-i18n="myReqs" style="margin:0"></h2>
   <button class="btn" id="addBtn" data-i18n="addReq"></button></div>
  <div id="rform" class="card hide" style="margin:.8rem 0">
   <div class="formgrid">
    <div><label for="rcat" data-i18n="fruit"></label><select id="rcat"></select></div>
    <div><label for="rvar" data-i18n="variety"></label><input id="rvar" maxlength="80"></div>
    <div><label for="rqty" data-i18n="qty"></label><input id="rqty" type="number" min="0" step="any"></div>
    <div><label for="runit" data-i18n="unit"></label><select id="runit"></select></div>
    <div><label for="rpmin" data-i18n="priceFrom"></label><input id="rpmin" type="number" min="0" step="any"></div>
    <div><label for="rpmax" data-i18n="priceTo"></label><input id="rpmax" type="number" min="0" step="any"></div>
    <div><label for="rgrade" data-i18n="quality"></label><select id="rgrade"></select></div>
    <div><label for="rdate" data-i18n="reqDate"></label><input id="rdate" type="date"></div>
    <div><label for="rarea" data-i18n="prefArea"></label><input id="rarea" maxlength="120"></div>
    <div><label for="rdel" data-i18n="delLoc"></label><input id="rdel" maxlength="160"></div>
    <div><label for="rstatus" data-i18n="status"></label><select id="rstatus"></select></div>
   </div>
   <button class="btn" id="saveBtn" data-i18n="save"></button>
   <button class="btn ghost" id="cancelBtn" data-i18n="cancel"></button>
   <div id="rmsg" class="msg hide" role="alert"></div>
  </div>
  <div id="reqs" class="grid" style="margin-top:.8rem"></div>
 </section>

 <section id="find">
  <h2 data-i18n="farmersNear"></h2>
  <div class="filters">
   <div><label for="fc" data-i18n="fruit"></label><select id="fc"></select></div>
   <div><label for="fl" data-i18n="location"></label><input id="fl" placeholder="Nashik"></div>
   <div><label for="fq" data-i18n="minQty"></label><input id="fq" type="number" min="0"></div>
   <div><label for="fp" data-i18n="maxPrice"></label><input id="fp" type="number" min="0"></div>
   <div><label for="fr" data-i18n="minRating"></label>
    <select id="fr"><option value="" data-i18n="any"></option><option value="3">3 ★</option><option value="4">4 ★</option></select></div>
  </div>
  <div id="farmers" class="grid"></div>
 </section>

 <h2 data-i18n="appts"></h2><div id="mtg"></div>
 <div class="tx" style="margin-top:1.4rem">
  <h2 data-i18n="activeDeals"></h2><div id="dls"></div>
 </div>
</main>
<script src="js/translations.js"></script><script src="js/app.js"></script>
<script>
let cats=[],reqs=[],farmers=[],editing=null;
function flash(msg){const f=$("flash");f.textContent=msg;f.className="msg";setTimeout(()=>f.className="msg hide",5000);}

// ================= My requirements
function fillSelects(){
 const ids=["rcat","runit","rstatus","rgrade","fc"],keep=ids.map(i=>$(i).value);
 const opts=cats.map(c=>`<option value="${c.id}">${esc(catName(c))}</option>`).join("");
 $("rcat").innerHTML=opts;
 $("fc").innerHTML=`<option value="">${t("myNeeds")}</option>`+opts;
 $("runit").innerHTML=`<option value="kg">${t("kg")}</option><option value="tons">${t("tons")}</option>`;
 $("rstatus").innerHTML=["ACTIVE","PAUSED","CLOSED"].map(s=>`<option value="${s}">${t(STATUS[s])}</option>`).join("");
 $("rgrade").innerHTML='<option value="">—</option><option>A</option><option>B</option><option>C</option>';
 ids.forEach((i,k)=>{if(keep[k])$(i).value=keep[k];});
}
function drawReqs(){
 $("reqs").innerHTML=reqs.length?reqs.map(r=>`
  <div class="card"><strong>${esc(catName(r.category))}</strong>${r.variety?" · "+esc(r.variety):""}
   <span class="badge">${t(STATUS[r.status])}</span>
   <p>${t("qty")}: ${fmtKg(r.quantityKg)}<br>${t("target")}: ${price(r.targetPriceMin,r.targetPriceMax)}
   ${r.qualityGrade?"<br>"+t("quality")+": "+esc(r.qualityGrade):""}</p>
   <div class="actions">
    <button class="btn ghost" onclick="openForm(${r.id})">${t("edit")}</button>
    ${r.status=="ACTIVE"?`<button class="btn ghost" onclick="setStatus(${r.id},'PAUSED')">${t("pause")}</button>`
      :r.status=="PAUSED"?`<button class="btn ghost" onclick="setStatus(${r.id},'ACTIVE')">${t("resume")}</button>`:""}
    ${r.status!="CLOSED"?`<button class="btn ghost" onclick="setStatus(${r.id},'CLOSED')">${t("close")}</button>`:""}
   </div></div>`).join("")
  :`<div class="empty" style="grid-column:1/-1">${t("emptyReqs")}</div>`;
}
async function loadReqs(){const r=await api("/api/requirements/mine");if(r.ok){reqs=r.data;drawReqs();}}
const bodyOf=(r,status)=>({categoryId:r.category.id,variety:r.variety,quantityKg:r.quantityKg,targetPriceMin:r.targetPriceMin,
 targetPriceMax:r.targetPriceMax,qualityGrade:r.qualityGrade,requiredDate:r.requiredDate,preferredArea:r.preferredArea,
 deliveryLocation:r.deliveryLocation,status});
async function setStatus(id,status){
 const r=await api("/api/requirements/"+id,"PUT",bodyOf(reqs.find(x=>x.id==id),status));
 if(r.ok){await loadReqs();loadFarmers();}else flash(errMsg(r));
}
function openForm(id){
 editing=id||null;const r=editing&&reqs.find(x=>x.id==id);fillSelects();
 $("rcat").value=r?r.category.id:(cats[0]&&cats[0].id);$("rvar").value=r?r.variety||"":"";
 $("rqty").value=r?r.quantityKg:"";$("runit").value="kg";$("rpmin").value=r?r.targetPriceMin||"":"";
 $("rpmax").value=r?r.targetPriceMax:"";$("rgrade").value=r?r.qualityGrade||"":"";$("rdate").value=r?r.requiredDate||"":"";
 $("rarea").value=r?r.preferredArea||"":"";$("rdel").value=r?r.deliveryLocation||"":"";
 $("rstatus").value=r?r.status:"ACTIVE";$("rmsg").className="msg hide";
 $("rform").classList.remove("hide");$("rform").scrollIntoView({behavior:"smooth"});
}
function closeForm(){editing=null;$("rform").classList.add("hide");}
async function saveReq(){
 const m=$("rmsg");m.className="msg";
 const qty=+$("rqty").value,hi=+$("rpmax").value,lo=+$("rpmin").value;
 if(!$("rcat").value||!(qty>0)||!(hi>0)){m.textContent=t("required");return;}
 if(lo&&lo>hi){m.textContent=t("priceRange");return;}
 const body={categoryId:+$("rcat").value,variety:$("rvar").value.trim(),quantityKg:qtyToKg(qty,$("runit").value),
  targetPriceMin:lo||null,targetPriceMax:hi,qualityGrade:$("rgrade").value,requiredDate:$("rdate").value||null,
  preferredArea:$("rarea").value.trim(),deliveryLocation:$("rdel").value.trim(),status:$("rstatus").value};
 const r=editing?await api("/api/requirements/"+editing,"PUT",body):await api("/api/requirements","POST",body);
 if(!r.ok){m.textContent=errMsg(r);return;}
 closeForm();await loadReqs();loadFarmers();flash(t("saved"));
}

// ================= Find farmers (real data from /api/discover/farmers)
async function loadFarmers(){
 const p=new URLSearchParams();
 if($("fc").value)p.set("categoryId",$("fc").value);
 if($("fl").value.trim())p.set("location",$("fl").value.trim());
 if($("fq").value)p.set("minQty",$("fq").value);
 if($("fp").value)p.set("maxPrice",$("fp").value);
 if($("fr").value)p.set("minRating",$("fr").value);
 const r=await api("/api/discover/farmers?"+p);
 farmers=r.ok?r.data:[];drawFarmers();
}
function drawFarmers(){
 $("farmers").innerHTML=farmers.length?farmers.map(f=>`
  <div class="card"><strong>${esc(f.farmerName)}</strong>${f.farmName?" · "+esc(f.farmName):""}<br>
   <span class="muted">${esc(f.location)}</span>
   <p><span class="badge ${f.matchRank<=3?"near":""}">${t("lvl"+f.matchLevel)}</span></p>${thumbs(f.images)}
   <p><strong>${esc(catName(f.category))}</strong>${f.variety?" ("+esc(f.variety)+")":""}<br>
   ${t("qty")}: ${fmtKg(f.quantityKg)}<br>${t("expected")}: ₹${f.expectedPricePerKg}/${t("kg")}
   ${f.qualityGrade?"<br>"+t("quality")+": "+esc(f.qualityGrade):""}</p>
   <p>${f.avgRating==null?t("noRatings"):stars(f.avgRating)+" ("+f.reviewCount+" "+t("reviews")+")"}<br>
   <span class="muted">${f.completedDeals} ${t("deals")}</span></p>
   <a class="btn ghost" href="profile.html?id=${f.farmerId}">${t("viewProfile")}</a></div>`).join("")
  :`<div class="empty" style="grid-column:1/-1">${t("emptyFarmers")}</div>`;
}

$("addBtn").onclick=()=>openForm();$("saveBtn").onclick=saveReq;$("cancelBtn").onclick=closeForm;
const reload=deb(loadFarmers);["fc","fl","fq","fp","fr"].forEach(i=>$(i).addEventListener("input",reload));
window.onLang=()=>{
 if(me)$("who").textContent=t("hello")+", "+me.businessName+" ("+me.name+")";
 fillSelects();drawReqs();drawFarmers();mtgSummary.draw();dealsSummary.draw();
};
initPage("MERCHANT").then(async ok=>{
 if(!ok)return;
 const c=await api("/api/categories");if(c.ok)cats=c.data;
 fillSelects();mtgSummary.load();dealsSummary.load();await loadReqs();loadFarmers();
});
</script></body></html>
