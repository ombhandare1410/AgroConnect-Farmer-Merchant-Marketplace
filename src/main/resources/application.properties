spring.application.name=AgroConnect

# Database: password comes from an environment variable, never from source code
spring.datasource.url=jdbc:mysql://localhost:3306/agroconnect?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 'update' creates/updates tables from the entities. Fine for development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Used later for photo uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB
app.upload-dir=uploads

# Login session cookie
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Optional first admin account, created at startup from environment variables
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
